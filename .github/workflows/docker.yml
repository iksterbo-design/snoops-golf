name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/iksterbo-design/ai-golf-coach

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_DEMO_MODE=true
            INSTALL_FFMPEG=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull the exact tag metadata-action pushed (type=sha -> sha-<short-sha>).
      - name: Smoke test the pushed image
        if: github.event_name != 'pull_request'
        run: |
          TAG="sha-$(printf '%s' "${{ github.sha }}" | cut -c1-7)"
          IMAGE="${{ env.IMAGE }}:${TAG}"
          echo "smoke-testing ${IMAGE}"
          docker pull "${IMAGE}"
          docker run -d --rm --name agc -p 3100:3000 "${IMAGE}"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -s http://127.0.0.1:3100/api/health
          echo
          curl -sf -o /dev/null http://127.0.0.1:3100/manifest.webmanifest && echo "manifest OK"
          docker stop agc

      # On pull requests nothing is pushed, so build natively and test that.
      - name: Smoke test a local build
        if: github.event_name == 'pull_request'
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_DEMO_MODE=true \
            --build-arg INSTALL_FFMPEG=true \
            -t ai-golf-coach:smoke .
          docker run -d --rm --name agc -p 3100:3000 ai-golf-coach:smoke
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -s http://127.0.0.1:3100/api/health
          echo
          curl -sf -o /dev/null http://127.0.0.1:3100/manifest.webmanifest && echo "manifest OK"
          docker stop agc

