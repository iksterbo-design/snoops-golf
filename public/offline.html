<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI Golf Coach — offline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #0b1220; color: #e2e8f0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card { max-width: 460px; text-align: center; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #15803d; color: #ecfdf5; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  h1 { font-size: 22px; margin: 14px 0 8px; }
  p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
  a { color: #4ade80; }
  button {
    margin-top: 18px; padding: 10px 18px; border-radius: 10px; border: 1px solid #334155;
    background: #111827; color: #e2e8f0; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">AI Golf Coach</span>
    <h1>You&rsquo;re offline</h1>
    <p>Swing reviews need your account and the analysis service, so they can&rsquo;t load
       without a connection. Your saved reviews, coach notes and practice plans will be
       here when you&rsquo;re back online.</p>
    <button onclick="location.reload()">Try again</button>
    <p style="margin-top:22px"><a href="/">Back to the home page</a></p>
  </main>
</body>
</html>
